services:
  db:
    # Образ Postgres с уже установленным расширением pgvector
    image: ankane/pgvector:latest
    container_name: ai-analyst-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: analytics_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d analytics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: